        function openRelevantTab(selectedFAQ) {
            Object.keys(faqData).forEach(tab => {
                if (faqData[tab].includes(selectedFAQ)) {
                    openTab(null, tab);
                }
            });
        }

        function openTab(evt, tabName) {
            document.querySelectorAll('.faq-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.faq-tab').forEach(tab => tab.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            if (evt) evt.currentTarget.classList.add('active');
        }

        function toggleAnswer(id, element) {
            const answer = document.getElementById(id);
            answer.classList.toggle("active");
            element.classList.toggle("active"); // クリックされた `faq-item` に `active` を付与/削除
        }

        function showTab(tabId) {
                            // 全てのタブを非アクティブにする
                            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
                            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
                    
                            // クリックされたタブとコンテンツをアクティブにする
                            document.querySelector(`[onclick="showTab('${tabId}')"]`).classList.add('active');
                            document.getElementById(tabId).classList.add('active');
                        }
