        <header class="header">
            <div class="logo">
                itechem（個人事業主） - Windows向け高機能関数電卓「S-Calc」開発

            </nav>
        </header>
        <div>
            <div class="main">
                <div class="main_content">
                    
                    <h1>ご注文フォーム</h1>

                    <h2><strong>Order Form</strong></h2>

                    <form id="orderForm">
                        <label><b>名前</b></label><br>
                        <input type="text" name="name" required><br>

                        <br>

                        <label><b>メールアドレス</b></label><br>
                        <input type="email" name="email" required><br>

                        <br>

                        <label><b>購入商品</b></label><br>
                        <select name="product" style="border: 1px solid black; font-size: large; font-weight: bold;">
                            <option value="S-Calc 製品版">S-Calc 製品版</option>
                            <option value="S-Calc 体験版">S-Calc 体験版</option>
                        </select><br>

                        <br>

                        <label><b>注文個数</b></label><br>
                        <input type="number" name="quantity" min="1" value="1" required><br>

                        <br>

                        <label><b>支払い方法</b></label><br>
                        <select name="payment" style="border: 1px solid black; font-size: large; font-weight: bold;">
                          <option value="銀行振込">銀行振込</option>
                          <!--<option value="クレジットカード">クレジットカード（今後対応予定）</option>-->
                        </select><br>
                      
                        <br>
                        
                        <label><b>備考</b></label><br>
                        <textarea name="note" style="border: 1px solid black; width: 500px; height: 150px;"></textarea><br>
                      
                        <br>

                        <button type="submit" style="border: 1px solid black;">注文する</button>
                      </form>

                      <script>
                        document.getElementById("orderForm").addEventListener("submit", function(event) {
                            event.preventDefault(); // フォームのデフォルト送信を防ぐ

                            let formData = new FormData(this);
                            let jsonData = {};
                            formData.forEach((value, key) => { jsonData[key] = value; });

                            // 送信ボタンのテキストを変更（送信中）
                            let submitButton = document.querySelector("button[type='submit']");
                            submitButton.textContent = "送信中...";

                            fetch("https://script.google.com/macros/s/AKfycbyu1Kpf0U1w1AQcOcP7gZivXGfUGg2WOodlkW9caro6KUY1illRsDmptOtzKzWrswno/exec", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(jsonData)
                            })
                            .then(response => response.text()) // ✅ レスポンスを適切に処理
                            .then(data => {
                                // 送信完了後の処理
                                alert("注文を受け付けました！"); // ✅ アラート表示
                                document.getElementById("orderForm").reset(); // ✅ フォームをクリア
                                submitButton.textContent = "注文する"; // ✅ ボタンのテキストを戻す
                            })
                            .catch(error => {
                                alert("エラーが発生しました。もう一度お試しください。");
                                submitButton.textContent = "注文する";
                            });
                        });
                    </script>
                </div>
